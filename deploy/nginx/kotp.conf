# King of the Page: nginx site. Serves the built client and proxies the game's WebSocket.
# Install as /etc/nginx/sites-available/kotp and replace kotp.example.com with your domain.
# `certbot --nginx -d your.domain` then adds HTTPS (the client switches to wss:// by itself).

# Pass the Upgrade handshake through for /ws, plain keep-alive otherwise.
map $http_upgrade $connection_upgrade {
	default upgrade;
	"" close;
}

server {
	listen 80;
	listen [::]:80;
	server_name kotp.example.com;

	root /opt/kotp/apps/client/dist;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	location /ws {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Players can sit idle for a long time; the server also pings every 30 s.
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}

	location = /healthz {
		proxy_pass http://127.0.0.1:8080;
		access_log off;
	}

	# Vite puts a content hash in every asset name, so they can be cached forever.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}
}
