<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>King of the Page</title>
		<link rel="icon" href="data:," />
		<style>
			:root {
				--dark: #0f380f;
				--mid: #306230;
				--light: #8bac0f;
				--pale: #9bbc0f;
				--gold: #ffd60a;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: var(--dark);
				color: var(--pale);
				font-family: ui-monospace, Menlo, Consolas, monospace;
			}
			#game {
				position: fixed;
				inset: 0;
			}
			.panel {
				background: var(--dark);
				border: 4px solid var(--light);
				box-shadow: 0 0 0 4px var(--dark);
				padding: 16px;
			}
			#join {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: rgba(15, 56, 15, 0.85);
				z-index: 10;
			}
			#join[hidden] {
				display: none;
			}
			#join h1 {
				margin: 0 0 12px;
				font-size: 22px;
				color: var(--gold);
				letter-spacing: 1px;
			}
			#join p {
				margin: 8px 0 0;
				font-size: 13px;
			}
			#join-form {
				display: flex;
				gap: 8px;
			}
			#join input,
			#join button {
				font: inherit;
				font-size: 16px;
				padding: 8px 10px;
				border: 3px solid var(--light);
				background: var(--pale);
				color: var(--dark);
				min-width: 0;
			}
			#join button {
				background: var(--gold);
				cursor: pointer;
			}
			#join-error {
				color: #ffb4a2;
				min-height: 1em;
			}
			#hud {
				position: fixed;
				top: 12px;
				left: 12px;
				padding: 8px 12px;
				font-size: 14px;
				z-index: 5;
			}
			#hud b {
				color: var(--gold);
			}
			#hud .help {
				margin-top: 6px;
				font-size: 11px;
				opacity: 0.8;
			}
			#allies {
				position: fixed;
				top: 12px;
				right: 12px;
				width: 220px;
				padding: 8px;
				font-size: 13px;
				z-index: 5;
			}
			#ally-form {
				display: flex;
				gap: 4px;
			}
			#allies input,
			#allies button,
			#confirm button {
				font: inherit;
				border: 2px solid var(--light);
				background: var(--pale);
				color: var(--dark);
				padding: 3px 6px;
				min-width: 0;
			}
			#allies input {
				flex: 1;
			}
			#allies button,
			#confirm button {
				background: var(--gold);
				cursor: pointer;
			}
			#ally-list {
				list-style: none;
				margin: 8px 0 0;
				padding: 0;
				display: grid;
				gap: 4px;
			}
			#ally-list li {
				display: flex;
				align-items: center;
				gap: 4px;
			}
			#ally-list span {
				flex: 1;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.ally {
				color: #7cff7c;
			}
			.muted {
				opacity: 0.7;
			}
			#board {
				position: fixed;
				right: 12px;
				bottom: 12px;
				width: 260px;
				padding: 8px 10px;
				font-size: 12px;
				z-index: 5;
			}
			#board summary {
				cursor: pointer;
				color: var(--gold);
				font-size: 13px;
			}
			#board .cols {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px;
			}
			#board h2 {
				margin: 6px 0 2px;
				font-size: 12px;
			}
			#board ol {
				list-style: none;
				margin: 0;
				padding: 0;
			}
			#board li {
				display: flex;
				justify-content: space-between;
				gap: 4px;
			}
			#board li span {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			#board li.me {
				color: var(--gold);
			}
			#board p {
				margin: 6px 0 0;
				opacity: 0.8;
			}
			@media (max-width: 640px) {
				#board {
					display: none;
				}
			}
			#confirm {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: rgba(15, 56, 15, 0.6);
				z-index: 30;
			}
			#confirm[hidden] {
				display: none;
			}
			#confirm .panel {
				max-width: min(360px, calc(100vw - 64px));
			}
			#confirm .buttons {
				display: flex;
				gap: 8px;
				justify-content: flex-end;
			}
			@media (max-width: 640px) {
				#allies {
					top: auto;
					bottom: 80px;
				}
			}
			#toast {
				position: fixed;
				left: 50%;
				bottom: 24px;
				transform: translateX(-50%);
				padding: 10px 14px;
				font-size: 14px;
				z-index: 20;
				max-width: calc(100vw - 64px);
			}
		</style>
	</head>
	<body>
		<div id="game"></div>
		<div id="join" hidden>
			<div class="panel">
				<h1>King of the Page</h1>
				<form id="join-form">
					<input id="join-handle" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Your name" />
					<button type="submit">Play</button>
				</form>
				<p id="join-error"></p>
				<p>Chop trees, build fences, enclose land.</p>
			</div>
		</div>
		<div id="hud" class="panel" hidden>
			<div><span id="hud-handle"></span> · Wood <b id="hud-wood">0</b> · Gold <b id="hud-gold">0</b><span id="hud-rate"></span> · <span id="hud-pos"></span></div>
			<div class="help" id="help"></div>
		</div>
		<div id="allies" class="panel" hidden>
			<form id="ally-form">
				<input id="ally-handle" maxlength="16" placeholder="Ally with…" autocomplete="off" spellcheck="false" aria-label="Player name to ally with" />
				<button type="submit">Ask</button>
			</form>
			<ul id="ally-list"></ul>
		</div>
		<details id="board" class="panel" open hidden>
			<summary>Leaderboards</summary>
			<div class="cols">
				<div><h2>Land</h2><ol id="board-land"></ol></div>
				<div><h2>Gold</h2><ol id="board-gold"></ol></div>
			</div>
			<p id="board-you"></p>
		</details>
		<div id="confirm" hidden>
			<div class="panel">
				<p id="confirm-text"></p>
				<div class="buttons"><button type="button" id="confirm-no">Cancel</button><button type="button" id="confirm-yes">Chop it</button></div>
			</div>
		</div>
		<div id="toast" class="panel" hidden></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
