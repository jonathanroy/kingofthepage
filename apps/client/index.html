<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>King of the Page</title>
		<link rel="icon" href="data:," />
		<style>
			:root {
				--dark: #0f380f;
				--mid: #306230;
				--light: #8bac0f;
				--pale: #9bbc0f;
				--gold: #ffd60a;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: var(--dark);
				color: var(--pale);
				font-family: ui-monospace, Menlo, Consolas, monospace;
			}
			#game {
				position: fixed;
				inset: 0;
			}
			.panel {
				background: var(--dark);
				border: 4px solid var(--light);
				box-shadow: 0 0 0 4px var(--dark);
				padding: 16px;
			}
			#join {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: rgba(15, 56, 15, 0.85);
				z-index: 10;
			}
			#join[hidden] {
				display: none;
			}
			#join h1 {
				margin: 0 0 12px;
				font-size: 22px;
				color: var(--gold);
				letter-spacing: 1px;
			}
			#join p {
				margin: 8px 0 0;
				font-size: 13px;
			}
			#join-form {
				display: flex;
				gap: 8px;
			}
			#join input,
			#join button {
				font: inherit;
				font-size: 16px;
				padding: 8px 10px;
				border: 3px solid var(--light);
				background: var(--pale);
				color: var(--dark);
				min-width: 0;
			}
			#join button {
				background: var(--gold);
				cursor: pointer;
			}
			#join-error {
				color: #ffb4a2;
				min-height: 1em;
			}
			#hud {
				position: fixed;
				top: 12px;
				left: 12px;
				padding: 8px 12px;
				font-size: 14px;
				z-index: 5;
			}
			#hud b {
				color: var(--gold);
			}
			#hud .help {
				margin-top: 6px;
				font-size: 11px;
				opacity: 0.8;
			}
			#toast {
				position: fixed;
				left: 50%;
				bottom: 24px;
				transform: translateX(-50%);
				padding: 10px 14px;
				font-size: 14px;
				z-index: 20;
				max-width: calc(100vw - 64px);
			}
		</style>
	</head>
	<body>
		<div id="game"></div>
		<div id="join" hidden>
			<div class="panel">
				<h1>King of the Page</h1>
				<form id="join-form">
					<input id="join-handle" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Your name" />
					<button type="submit">Play</button>
				</form>
				<p id="join-error"></p>
				<p>Chop trees, build fences, enclose land.</p>
			</div>
		</div>
		<div id="hud" class="panel" hidden>
			<div><span id="hud-handle"></span> · Wood <b id="hud-wood">0</b> · <span id="hud-pos"></span></div>
			<div class="help">Arrows/WASD move · Space chop · F fence (2 wood)</div>
		</div>
		<div id="toast" class="panel" hidden></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
