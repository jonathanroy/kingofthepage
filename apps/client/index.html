<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>King of the Page</title>
		<link rel="icon" href="data:," />
		<style>
			/* Cozy dialog-box HUD matching the countryside art: cream panels, plum outline. */
			:root {
				--ink: #2b2233;
				--panel: #fff8e8;
				--panel-edge: #2b2233;
				--panel-inner: #e9dcc0;
				--muted: #6b5d70;
				--gold: #ffcf3f;
				--gold-ink: #9a6a00;
				--ally: #2f9c55;
				--danger: #c43c4a;
				--field: #ffffff;
				--pixel: "Pixelify Sans", ui-monospace, Menlo, monospace;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #2b2233;
				color: var(--ink);
				font-family: var(--pixel);
				font-size: 15px;
			}
			#game {
				position: fixed;
				inset: 0;
			}
			.panel {
				background: var(--panel);
				border: 3px solid var(--panel-edge);
				border-radius: 6px;
				box-shadow: inset 0 0 0 2px var(--panel-inner), 0 3px 0 rgba(43, 34, 51, 0.35);
				padding: 12px 14px;
			}
			button,
			input {
				font: inherit;
				border: 2px solid var(--panel-edge);
				border-radius: 4px;
				padding: 5px 9px;
				min-width: 0;
			}
			input {
				background: var(--field);
				color: var(--ink);
			}
			button {
				background: var(--gold);
				color: var(--ink);
				cursor: pointer;
				box-shadow: 0 2px 0 var(--panel-edge);
			}
			button:active {
				transform: translateY(2px);
				box-shadow: none;
			}
			button:focus-visible,
			input:focus-visible,
			summary:focus-visible {
				outline: 2px solid var(--gold-ink);
				outline-offset: 2px;
			}
			.icon {
				width: 21px;
				height: 15px;
				image-rendering: pixelated;
				vertical-align: -2px;
			}
			.icon.coin {
				width: 15px;
			}
			#join {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: rgba(43, 34, 51, 0.55);
				z-index: 10;
				padding: 16px;
			}
			#join[hidden] {
				display: none;
			}
			#join h1 {
				margin: 0 0 12px;
				font-size: 26px;
				font-weight: 700;
				color: var(--ink);
			}
			#join p {
				margin: 10px 0 0;
				font-size: 14px;
				color: var(--muted);
			}
			#join-form {
				display: flex;
				gap: 8px;
			}
			#join input,
			#join button {
				font-size: 17px;
				padding: 8px 12px;
			}
			#join-error {
				color: var(--danger);
				min-height: 1em;
			}
			#hud {
				position: fixed;
				top: 12px;
				left: 12px;
				z-index: 5;
				display: grid;
				gap: 4px;
			}
			#hud .stats {
				display: flex;
				gap: 12px;
				align-items: center;
				flex-wrap: wrap;
			}
			#hud b {
				font-weight: 700;
				font-variant-numeric: tabular-nums;
			}
			#hud-handle {
				font-weight: 700;
			}
			#hud-rate {
				color: var(--gold-ink);
			}
			#hud-pos {
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
			#hud .help {
				font-size: 12px;
				color: var(--muted);
			}
			#allies {
				position: fixed;
				top: 12px;
				right: 12px;
				width: 230px;
				font-size: 14px;
				z-index: 5;
			}
			#ally-form {
				display: flex;
				gap: 6px;
			}
			#allies input {
				flex: 1;
			}
			#ally-list {
				list-style: none;
				margin: 10px 0 0;
				padding: 0;
				display: grid;
				gap: 6px;
			}
			#ally-list li {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			#ally-list span {
				flex: 1;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			#ally-list button {
				padding: 2px 7px;
				font-size: 13px;
			}
			.ally {
				color: var(--ally);
			}
			.muted {
				color: var(--muted);
			}
			#confirm {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: rgba(43, 34, 51, 0.45);
				z-index: 30;
				padding: 16px;
			}
			#confirm[hidden] {
				display: none;
			}
			#confirm .panel {
				max-width: min(380px, calc(100vw - 64px));
			}
			#confirm p {
				margin: 0 0 12px;
			}
			#confirm .buttons {
				display: flex;
				gap: 8px;
				justify-content: flex-end;
			}
			#confirm-no {
				background: var(--field);
			}
			#board {
				position: fixed;
				right: 12px;
				bottom: 12px;
				width: 270px;
				font-size: 13px;
				z-index: 5;
			}
			#board summary {
				cursor: pointer;
				font-size: 15px;
				font-weight: 700;
			}
			#board .cols {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 10px;
			}
			#board h2 {
				margin: 8px 0 2px;
				font-size: 13px;
				color: var(--muted);
			}
			#board ol {
				list-style: none;
				margin: 0;
				padding: 0;
			}
			#board li {
				display: flex;
				justify-content: space-between;
				gap: 4px;
				font-variant-numeric: tabular-nums;
			}
			#board li span {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			#board li.me {
				color: var(--gold-ink);
				font-weight: 700;
			}
			#board p {
				margin: 8px 0 0;
				color: var(--muted);
			}
			@media (max-width: 640px) {
				#board {
					display: none;
				}
				#allies {
					top: auto;
					bottom: 80px;
				}
			}
			#toast {
				position: fixed;
				left: 50%;
				bottom: 24px;
				transform: translateX(-50%);
				font-size: 15px;
				z-index: 20;
				max-width: calc(100vw - 64px);
			}
		</style>
	</head>
	<body>
		<div id="game"></div>
		<div id="join" hidden>
			<div class="panel">
				<h1>King of the Page</h1>
				<form id="join-form">
					<input id="join-handle" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Your name" />
					<button type="submit">Play</button>
				</form>
				<p id="join-error"></p>
				<p>Chop trees, build fences, enclose land.</p>
			</div>
		</div>
		<div id="hud" class="panel" hidden>
			<div class="stats">
				<span id="hud-handle"></span>
				<span><img class="icon" id="icon-wood" alt="Wood" /> <b id="hud-wood">0</b></span>
				<span><img class="icon" id="icon-iron" alt="Iron" /> <b id="hud-iron">0</b></span>
				<span><img class="icon coin" id="icon-gold" alt="Gold" /> <b id="hud-gold">0</b><span id="hud-rate"></span></span>
				<span id="hud-pos"></span>
			</div>
			<div class="help" id="help"></div>
		</div>
		<div id="allies" class="panel" hidden>
			<form id="ally-form">
				<input id="ally-handle" maxlength="16" placeholder="Ally with…" autocomplete="off" spellcheck="false" aria-label="Player name to ally with" />
				<button type="submit">Ask</button>
			</form>
			<ul id="ally-list"></ul>
		</div>
		<details id="board" class="panel" open hidden>
			<summary>Leaderboards</summary>
			<div class="cols">
				<div><h2>Land</h2><ol id="board-land"></ol></div>
				<div><h2>Gold</h2><ol id="board-gold"></ol></div>
			</div>
			<p id="board-you"></p>
		</details>
		<div id="confirm" hidden>
			<div class="panel">
				<p id="confirm-text"></p>
				<div class="buttons"><button type="button" id="confirm-no">Cancel</button><button type="button" id="confirm-yes">Chop it</button></div>
			</div>
		</div>
		<div id="toast" class="panel" hidden></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
